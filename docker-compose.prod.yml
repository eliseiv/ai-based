# Production compose template for one backend instance behind the common Traefik edge.
# Runtime values come from two env files:
# - .env: instance secrets/settings (SOPS-managed in deploy/instances/*.env.enc)
# - .env.image: API_IMAGE generated by CI for the selected Docker image tag
#
# The deploy workflow runs compose with `-p <INSTANCE_SLUG>`, so containers,
# networks and the `pgdata` volume are isolated per instance.
services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${INSTANCE_SLUG}.rule=Host(`${SERVICE_DOMAIN}`)"
      - "traefik.http.routers.${INSTANCE_SLUG}.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_SLUG}.tls.certresolver=le"
      - "traefik.http.services.${INSTANCE_SLUG}.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  web:
    external: true
  default:

volumes:
  pgdata:
